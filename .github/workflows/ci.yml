name: CI and Supply Chain

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check .
      - name: Audit Python dependencies
        run: python -m pip_audit --local

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build --tag citypulse-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build --tag citypulse-frontend:${{ github.sha }} ./frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: citypulse-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: citypulse-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: citypulse-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-api.spdx.json
      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: citypulse-frontend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: citypulse-sboms-${{ github.sha }}
          path: "*.spdx.json"
          if-no-files-found: error
