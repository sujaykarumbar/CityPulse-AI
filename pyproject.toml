[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citypulse"
version = "0.1.0"
description = "AI-powered digital twin and urban intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "networkx>=3.3,<4.0",
    "scikit-learn>=1.5,<2.0",
    "prometheus-client>=0.21,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
    "pip-audit>=2.10,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
